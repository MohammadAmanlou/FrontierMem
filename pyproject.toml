[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontiermem-prototype"
version = "0.2.0"
description = "Counterfactual preference applicability boundaries for personalized LLMs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["frontiermem*"]
