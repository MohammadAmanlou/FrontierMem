name: Decision-memory unit tests
on:
  push:
    branches:
      - 'research/decision-sufficient-memory-2026-11'
      - 'research/multibackbone-2026-11'
      - 'research/smallbackbone-baselines-2026-11'
  pull_request:
    paths:
      - 'frontiermem/decision_memory.py'
      - 'tests/test_decision_memory.py'
      - 'tests/test_s2pref_pair_export.py'
      - 'scripts/export_s2pref_context_pairs.py'
      - 'scripts/hpc_data_preflight.py'
      - 'tests/test_hpc_data_preflight.py'
      - 'scripts/audit_s2pref_candidates.py'
      - 'tests/test_s2pref_candidate_audit.py'
      - 'scripts/prepare_dual_axis_run.py'
      - 'tests/test_prepare_dual_axis_run.py'
      - 'frontiermem/dual_axis_protocol.py'
      - 'scripts/train_dual_axis_qwen.py'
      - 'tests/test_dual_axis_qwen_protocol.py'
      - 'scripts/hpc_model_env_preflight.py'
      - 'tests/test_backbone_selection.py'
      - 'scripts/hpc_bootstrap_qwen_env.sbatch'
      - 'scripts/hpc_smoke_qwen35.sbatch'
      - 'scripts/hpc_queue_first_stages.sh'
      - 'scripts/hpc_collect_pipeline_status.sh'
      - 'scripts/hpc_weekly_reload.sbatch'
      - 'scripts/hpc_weekly_train.sbatch'
      - 'scripts/hpc_weekly_eval.sbatch'
      - 'scripts/hpc_weekly_report.sbatch'
      - 'scripts/hpc_queue_weekly.sh'
      - 'scripts/eval_weekly_heldout.py'
      - 'scripts/aggregate_weekly_results.py'
      - 'tests/test_weekly_pipeline.py'
      - 'docs/MODEL_BACKBONE_DECISION_2026-11-22.md'
      - 'scripts/demo_decision_memory.py'
      - '.github/workflows/decision-memory-tests.yml'
jobs:
  test-decision-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal CPU dependencies
        run: python -m pip install pytest 'pandas>=2.0' scipy scikit-learn
      - name: Run standalone decision-memory tests
        run: python -m pytest -q tests/test_decision_memory.py tests/test_s2pref_pair_export.py tests/test_hpc_data_preflight.py tests/test_s2pref_candidate_audit.py tests/test_prepare_dual_axis_run.py tests/test_dual_axis_qwen_protocol.py tests/test_backbone_selection.py tests/test_weekly_pipeline.py tests/test_lexical_baseline_objective.py
      - name: Syntax-check unattended HPC batch scripts
        run: |
          for f in scripts/hpc_*.sbatch scripts/hpc_*.sh; do
            bash -n "$f" || exit 1
          done
      - name: Compile weekly Python modules
        run: python -m compileall -q scripts/train_dual_axis_qwen.py scripts/eval_weekly_heldout.py scripts/aggregate_weekly_results.py scripts/train_modernbert_full.py scripts/train_lexical_baselines.py
      - name: Run non-scientific plumbing demonstration
        run: python scripts/demo_decision_memory.py | grep 'DEMO_ONLY_NOT_RESEARCH_EVIDENCE'
